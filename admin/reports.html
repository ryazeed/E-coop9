<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="instReportsTitle">Reports · E-COOP</title>
<link rel="icon" href="../images/logo.png">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/lang.js"></script>
</head>
<body>
<!-- ===== header: logo, menu, notifications, language, account ===== -->
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="analytics.html"><img src="../images/logo.png" alt=""> E-COOP</a>
    <nav class="nav" aria-label="Main menu">
      <a href="analytics.html" data-t="navAnalytics">Analytics</a>
      <a href="approvals.html" data-t="navApprovals">Approvals</a>
      <a href="users.html" data-t="navUsers">Users</a>
      <a href="assign.html" data-t="navAssign">Assign Supervisors</a>
      <a href="audit.html" data-t="navAudit">Audit Log</a>
      <a href="reports.html" class="active" data-t="navInstReports">Reports</a>
    </nav>
    <div class="top-actions">
      <button class="top-btn" type="button" onclick="toggleNotifications()">&#128276; <span class="txt" data-t="notifications">Notifications</span><span class="count" id="notif-count" hidden>0</span></button>
      <button class="top-btn" type="button" onclick="switchLanguage()" data-t="language">العربية</button>
      <a class="top-btn" href="settings.html" title="Settings"><span class="avatar" id="me-avatar"></span><span class="txt" id="me-name"></span></a>
    </div>
  </div>
  <div class="notif-panel" id="notif-panel" hidden>
    <div class="notif-head"><b data-t="notifications">Notifications</b><button class="btn btn-sm btn-light" type="button" onclick="toggleNotifications()" data-t="close">Close</button></div>
    <ul class="notif-list" id="notif-list"></ul>
  </div>
</header>

<!-- ===== page title ===== -->
<section class="hero">
  <div class="wrap hero-in">
    <div>
      <h1 data-t="instReportsTitle">Institutional Reports</h1>
      <p class="lead" id="lead"></p>
    </div>
  </div>
</section>

<!-- ===== page content ===== -->
<main class="wrap">
  <div class="card no-print">
    <div class="row" style="align-items:flex-end;justify-content:space-between">
      <div class="form-3" style="flex:1;min-width:280px">
        <div style="grid-column:1/-1"><label data-t="reportType">Report type</label>
          <div class="chips" id="report-kind">
            <button type="button" class="chip on" data-kind="placement" data-t="rPlacement">Placement by major</button>
            <button type="button" class="chip" data-kind="companies" data-t="rCompanies">Company participation</button>
            <button type="button" class="chip" data-kind="completion" data-t="rCompletion">Completion and evaluations</button>
          </div></div>
      </div>
      <div class="row">
        <button class="btn btn-light" type="button" id="print-btn" data-t="printPdf">Print / PDF</button>
        <button class="btn" type="button" id="csv-btn" data-t="exportExcel">Export Excel (CSV)</button>
      </div>
    </div>
  </div>
  <div id="report-out" class="section">
    <div class="print-only"><p class="muted" data-t="college">Jubail Industrial College</p><h2 id="report-title"></h2><p class="muted small" id="report-meta"></p></div>
    <div class="grid-3" id="report-stats"></div>
    <div class="table-box section"><table><thead id="report-head"></thead><tbody id="report-body"></tbody></table></div>
  </div>
</main>

<div id="toast" class="toast" hidden></div>
<script src="../js/main.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/reports.js"></script>
<script>startPage('Admin', renderInstReports);</script>
</body>
</html>

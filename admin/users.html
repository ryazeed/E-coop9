<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="usersTitle">Users · E-COOP</title>
<link rel="icon" href="../images/icon.png">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/lang.js"></script>
</head>
<body>
<!-- ===== header: logo, menu, notifications, language, account ===== -->
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="analytics.html"><img src="../images/logo.png" alt="E-COOP logo" width="800" height="452"><span>E-COOP</span></a>
    <nav class="nav" aria-label="Main menu">
      <a href="analytics.html"><span data-t="navAnalytics">Analytics</span></a>
      <a href="approvals.html"><span data-t="navApprovals">Approvals</span></a>
      <a href="users.html" class="active"><span data-t="navUsers">Users</span></a>
      <a href="assign.html"><span data-t="navAssign">Assign Supervisors</span></a>
      <a href="audit.html"><span data-t="navAudit">Audit Log</span></a>
      <a href="reports.html"><span data-t="navInstReports">Reports</span></a>
      <a href="chat.html"><span data-t="navChat">Chat</span><span class="nav-count" id="chat-count" hidden>0</span></a>
    </nav>
    <div class="top-actions">
      <button class="top-btn" type="button" onclick="toggleNotifications()">&#128276; <span class="txt" data-t="notifications">Notifications</span><span class="count" id="notif-count" hidden>0</span></button>
      <button class="top-btn" type="button" onclick="switchLanguage()" data-t="language">العربية</button>
      <a class="top-btn" href="settings.html" title="Settings"><span class="avatar" id="me-avatar"></span><span class="txt" id="me-name"></span></a>
    </div>
  </div>
  <div class="notif-panel" id="notif-panel" hidden>
    <div class="notif-head"><b data-t="notifications">Notifications</b><button class="btn btn-sm btn-light" type="button" onclick="toggleNotifications()" data-t="close">Close</button></div>
    <ul class="notif-list" id="notif-list"></ul>
  </div>
</header>

<!-- ===== page title ===== -->
<section class="hero">
  <div class="wrap hero-in">
    <div>
      <h1 data-t="usersTitle">User Accounts</h1>
      <p class="lead" id="lead"></p>
    </div>
  </div>
</section>

<!-- ===== page content ===== -->
<main class="wrap">
  <div class="chips" id="role-filter" style="margin-bottom:16px">
    <button type="button" class="chip on" data-role="" data-t="all">All</button>
    <button type="button" class="chip" data-role="Student" data-t="roleStudent">Student</button>
    <button type="button" class="chip" data-role="Company" data-t="roleCompany">Company</button>
    <button type="button" class="chip" data-role="Supervisor" data-t="roleSupervisor">Supervisor</button>
    <button type="button" class="chip" data-role="Admin" data-t="roleAdmin">Admin</button>
  </div>
  <div class="table-box">
    <table>
      <thead><tr><th data-t="fullName">Full name</th><th data-t="email">Email</th><th data-t="role">Role</th><th data-t="status">Status</th><th data-t="actions">Actions</th></tr></thead>
      <tbody id="users-body"></tbody>
    </table>
  </div>
</main>

<div id="toast" class="toast" hidden></div>
<script src="../js/main.js"></script>
<script src="../js/admin.js"></script>
<script>startPage('Admin', renderUsers);</script>
</body>
</html>

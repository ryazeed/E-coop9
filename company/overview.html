<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="navOverview">Overview · E-COOP</title>
<link rel="icon" href="../images/icon.png">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/lang.js"></script>
</head>
<body>
<!-- ===== header: logo, menu, notifications, language, account ===== -->
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="overview.html"><img src="../images/logo.png" alt="E-COOP logo" width="800" height="452"><span>E-COOP</span></a>
    <nav class="nav" aria-label="Main menu">
      <a href="overview.html" class="active"><span data-t="navOverview">Overview</span></a>
      <a href="postings.html"><span data-t="navPostings">Postings</span></a>
      <a href="applicants.html"><span data-t="navApplicants">Applicants</span></a>
      <a href="dailycode.html"><span data-t="navDailyCode">Daily Code</span></a>
      <a href="trainees.html"><span data-t="navTrainees">Trainees</span></a>
      <a href="chat.html"><span data-t="navChat">Chat</span><span class="nav-count" id="chat-count" hidden>0</span></a>
    </nav>
    <div class="top-actions">
      <button class="top-btn" type="button" onclick="toggleNotifications()">&#128276; <span class="txt" data-t="notifications">Notifications</span><span class="count" id="notif-count" hidden>0</span></button>
      <button class="top-btn" type="button" onclick="switchLanguage()" data-t="language">العربية</button>
      <a class="top-btn" href="settings.html" title="Settings"><span class="avatar" id="me-avatar"></span><span class="txt" id="me-name"></span></a>
    </div>
  </div>
  <div class="notif-panel" id="notif-panel" hidden>
    <div class="notif-head"><b data-t="notifications">Notifications</b><button class="btn btn-sm btn-light" type="button" onclick="toggleNotifications()" data-t="close">Close</button></div>
    <ul class="notif-list" id="notif-list"></ul>
  </div>
</header>

<!-- ===== page title ===== -->
<section class="hero">
  <div class="wrap hero-in">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="greeting">Welcome</h1>
      <p class="lead" id="lead"></p>
    </div>
    <div class="glass">
      <div class="glass-top"><span id="glass-label"></span><span class="glass-value" id="glass-value"></span></div>
      <div class="glass-bar"><span id="glass-bar" style="width:0%"></span></div>
      <p id="glass-note"></p>
    </div>
  </div>
</section>

<!-- ===== page content ===== -->
<main class="wrap">
  <nav class="tiles" aria-label="Quick actions">
    <a class="tile" href="postings.html?new=1"><span class="ico">&#10133;</span><span data-t="postOpp">Post Opportunity</span></a>
    <a class="tile" href="applicants.html"><span class="ico">&#128101;</span><span data-t="navApplicants">Applicants</span><span class="num" id="new-apps" hidden></span></a>
    <a class="tile" href="dailycode.html"><span class="ico">&#128273;</span><span data-t="navDailyCode">Daily Code</span></a>
    <a class="tile" href="trainees.html"><span class="ico">&#11088;</span><span data-t="navTrainees">Trainees</span></a>
  </nav>
  <div class="split section">
    <section>
      <h2 data-t="dailyCodeTitle">Daily Attendance Code</h2>
      <div id="code-cards" class="stack" style="margin-top:12px"></div>
    </section>
    <section>
      <h2 data-t="activity">Activity</h2>
      <div class="card" id="activity" style="margin-top:12px"></div>
    </section>
  </div>
</main>

<div id="toast" class="toast" hidden></div>
<script src="../js/main.js"></script>
<script src="../js/company.js"></script>
<script>startPage('Company', renderOverview);</script>
</body>
</html>

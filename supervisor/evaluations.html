<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="academicEvalTitle">Evaluations · E-COOP</title>
<link rel="icon" href="../images/icon.png">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/lang.js"></script>
</head>
<body>
<!-- ===== header: logo, menu, notifications, language, account ===== -->
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="students.html"><img src="../images/logo.png" alt="E-COOP logo" width="800" height="452"><span>E-COOP</span></a>
    <nav class="nav" aria-label="Main menu">
      <a href="students.html"><span data-t="navStudents">Students</span></a>
      <a href="attendance.html"><span data-t="navAttendance">Attendance</span></a>
      <a href="reports.html"><span data-t="navReports">Reports</span></a>
      <a href="evaluations.html" class="active"><span data-t="navEvaluations">Evaluations</span></a>
      <a href="academic.html"><span data-t="navAcademicReports">Academic Reports</span></a>
      <a href="chat.html"><span data-t="navChat">Chat</span><span class="nav-count" id="chat-count" hidden>0</span></a>
    </nav>
    <div class="top-actions">
      <button class="top-btn" type="button" onclick="toggleNotifications()">&#128276; <span class="txt" data-t="notifications">Notifications</span><span class="count" id="notif-count" hidden>0</span></button>
      <button class="top-btn" type="button" onclick="switchLanguage()" data-t="language">العربية</button>
      <a class="top-btn" href="settings.html" title="Settings"><span class="avatar" id="me-avatar"></span><span class="txt" id="me-name"></span></a>
    </div>
  </div>
  <div class="notif-panel" id="notif-panel" hidden>
    <div class="notif-head"><b data-t="notifications">Notifications</b><button class="btn btn-sm btn-light" type="button" onclick="toggleNotifications()" data-t="close">Close</button></div>
    <ul class="notif-list" id="notif-list"></ul>
  </div>
</header>

<!-- ===== page title ===== -->
<section class="hero">
  <div class="wrap hero-in">
    <div>
      <h1 data-t="academicEvalTitle">Academic Evaluations</h1>
      <p class="lead" id="lead"></p>
    </div>
  </div>
</section>

<!-- ===== page content ===== -->
<main class="wrap">
  <form class="card form" id="eval-form" novalidate>
      <div class="form-2">
        <div><label for="ev-student" data-t="student">Student</label><select id="ev-student"></select></div>
        <div><label for="ev-score"><span data-t="score">Score</span>: <b id="ev-score-out">80</b> / 100</label>
          <input type="range" id="ev-score" min="0" max="100" step="1" value="80"><span class="help" data-t="scoreHelp">0 to 100</span></div>
      </div>
      <div><label for="ev-comments" data-t="comments">Comments</label><textarea id="ev-comments"></textarea><span class="error" id="ev-error"></span></div>
      <div class="row row-end"><button class="btn" type="submit" data-t="submitEval">Submit Evaluation</button></div>
    </form>
  <section class="section">
    <h2 data-t="evaluations">Evaluations</h2>
    <div id="eval-list" style="margin-top:12px"></div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>
<script src="../js/main.js"></script>
<script src="../js/supervisor.js"></script>
<script>startPage('Supervisor', renderSupEvals);</script>
</body>
</html>
